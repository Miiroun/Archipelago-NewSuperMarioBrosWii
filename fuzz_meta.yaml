null:
  progression_balancing: 50 #
NSMBW: #
  level_shuffle_plando: {}
  level_shuffle_remove : []
  #percentage_filler_forced_local : 0
  world_comp_priority : false
  #world_unlock : separate
  #level_unlock : vanilla
  level_completion : true # this is needed for consistent clear, otherwise ~ 2% failure
  #level_shuffle : true
  #hint_movie_sanity  : false
  #alternative_goal : bowser
  starcoin_requirement_world_unlock : {}
  excluded_worlds : {}
  goal_starcoin_unlock : 0
  goal_world_unlock : 0
  goal_level_unlock : 0

  fuzz_constraints:
    - option: level_shuffle
      if_value: "on"
      then:
        hint_movie_sanity: 'false'
    - option: level_shuffle
      if_value: "true"
      then:
        hint_movie_sanity: 'false'
    - option: level_completion
      if_value: 'false'
      then:
        starcoin_sanity: 'true'

    # Settings below this point require enabling allow_gen_impactful_settings in the host.yaml to bypass
    - sum_cap:
        - include_inventory_powerups
      max_capacity: 100
    #- option: logic_difficulty
    #  if_value: 'hard'
    #  then:
    #    logic_difficulty: 'normal'
    - option: hint_movie_shop_price_logic
      if_value: 'ordered'
      then:
        hint_movie_shop_price_logic: 'progressive'
    - option: alternative_goal
      if_value: 'hintmovies'
      then:
        alternative_goal : 'bowser'
#empty:
#  accessibility: full


