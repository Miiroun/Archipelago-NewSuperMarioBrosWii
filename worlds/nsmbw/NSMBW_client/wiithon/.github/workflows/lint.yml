name: lint
on: workflow_call

jobs:

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .
        continue-on-error: true

      - name: MyPy
        run: mypy
        continue-on-error: true


